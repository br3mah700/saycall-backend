"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"Indicates what fields are available at the top level of a query operation."
type Query {
    # ─── User Queries ────────────────────────────────────────────────

    "Find a single user by ID or email."
    user(
        "Search by primary key."
        id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])

        "Search by email address."
        email: String @eq @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @find

    "Get the currently authenticated user."
    me: User @guard @auth

    "List all users with optional name filter (paginated)."
    users(
        "Filter by name using SQL LIKE wildcards % and _."
        name: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 10)

    # ─── Feed Queries ─────────────────────────────────────────────────────────────────────────────────────
    "Fetch a cursor-paginated feed of published posts."
    feed(
        "Number of items to fetch (max 50)."
        first: Int = 10

        "Cursor to fetch items after."
        after: String
    ): PostConnection! @field(resolver: "App\\GraphQL\\Queries\\Feed")

    # ─── Post Queries ────────────────────────────────────────────────

    "Find a single post by ID."
    post(id: ID! @eq): Post @find

    "List all posts (paginated), optionally filtered."
    posts(
        "Filter by published status."
        published: Boolean @eq

        "Filter by title using SQL LIKE wildcards."
        title: String @where(operator: "like")
    ): [Post!]! @paginate(defaultCount: 10)

    "List posts belonging to a specific user (paginated)."
    userPosts(
        user_id: ID! @eq
    ): [Post!]! @paginate(defaultCount: 10)
}

"Mutations available at the top level."
type Mutation {
    # ─── Auth Mutations ──────────────────────────────────────────────

    "Register a new user account and return an access token."
    register(
        name: String! @rules(apply: ["required", "string", "max:255"])
        email: String! @rules(apply: ["required", "email", "unique:users,email"])
        password: String! @rules(apply: ["required", "min:8"])
        device_name: String
    ): AuthPayload! @field(resolver: "App\\GraphQL\\Mutations\\Register")

    "Authenticate a user and return an access token."
    login(
        email: String! @rules(apply: ["required", "email"])
        password: String! @rules(apply: ["required"])
        device_name: String
    ): AuthPayload! @field(resolver: "App\\GraphQL\\Mutations\\Login")

    "Revoke the current user's access token."
    logout: LogoutResponse! @guard @field(resolver: "App\\GraphQL\\Mutations\\Logout")

    # ─── Post Mutations ──────────────────────────────────────────────

    "Create a new post."
    createPost(
        title: String! @rules(apply: ["required", "string", "max:255"])
        body: String!  @rules(apply: ["required", "string"])
        published: Boolean
        user_id: ID!   @rules(apply: ["required", "exists:users,id"])
        images: [PostImageInput!]
    ): Post @field(resolver: "App\\GraphQL\\Mutations\\CreatePost")

    "Update an existing post."
    updatePost(
        id: ID!
        title: String  @rules(apply: ["string", "max:255"])
        body: String   @rules(apply: ["string"])
        published: Boolean
    ): Post @field(resolver: "App\\GraphQL\\Mutations\\UpdatePost")

    "Delete a post by ID."
    deletePost(id: ID!): Post @field(resolver: "App\\GraphQL\\Mutations\\DeletePost")
}


"Relay-style edge containing a post node and its cursor."
type PostEdge {
    "Opaque cursor for this edge."
    cursor: String!

    "The post node."
    node: Post!
}

"Relay-style connection for cursor-paginated posts."
type PostConnection {
    "List of post edges."
    edges: [PostEdge!]!

    "Pagination info."
    pageInfo: PageInfo!
}

# ─── Types ───────────────────────────────────────────────────────────────────

"Authentication payload containing personal access token and user data."
type AuthPayload {
    "Sanctum personal access token."
    token: String!

    "Authenticated user details."
    user: User!
}

"Response returned when logging out."
type LogoutResponse {
    status: String!
    message: String!
}

"Account of a person who uses this application."
type User {
    "Unique primary key."
    id: ID!

    "Non-unique display name."
    name: String!

    "Unique email address."
    email: String!

    "When the email was verified."
    email_verified_at: DateTime

    "Posts authored by this user."
    posts: [Post!]! @hasMany

    "When the account was created."
    created_at: DateTime!

    "When the account was last updated."
    updated_at: DateTime!
}

"A blog post authored by a user."
type Post {
    "Unique primary key."
    id: ID!

    "Title of the post."
    title: String!

    "Full body content of the post."
    body: String!

    "Whether the post is published."
    published: Boolean!

    "The author of the post."
    user: User! @belongsTo

    "Images attached to the post."
    images: [PostImage!]! @hasMany

    "When the post was created."
    created_at: DateTime!

    "When the post was last updated."
    updated_at: DateTime!
}

"An image attached to a post."
type PostImage {
    "Unique primary key."
    id: ID!

    "Public URL of the image."
    url: String!

    "Alternative text for accessibility."
    alt: String

    "When the image was created."
    created_at: DateTime!
}

"Input data for creating a post image."
input PostImageInput {
    "Public URL of the image (uploaded separately or provided as data URL)."
    url: String!

    "Alternative text for accessibility."
    alt: String
}

"Pagination information (cursor-based)."
type PageInfo {
    "When paginating forwards, are there more items?"
    hasNextPage: Boolean!

    "When paginating backwards, are there more items?"
    hasPreviousPage: Boolean!

    "When paginating backwards, the cursor to continue."
    startCursor: String

    "When paginating forwards, the cursor to continue."
    endCursor: String

    "Total number of items in the connection."
    total: Int

    "Number of items in the current page."
    count: Int

    "Index of the current page."
    currentPage: Int

    "Index of the last available page."
    lastPage: Int
}
